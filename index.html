<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Andres Peppa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       START SCREEN
    ========================= */

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: white;

      background:
        radial-gradient(
          circle at center,
          #292929 0%,
          #0a0a0a 55%,
          #000 100%
        );
    }

    #startScreen h1 {
      margin: 0;

      font-size: clamp(48px, 10vw, 120px);
      font-weight: 900;
      letter-spacing: -6px;
      text-align: center;

      text-shadow:
        0 0 20px rgba(255,255,255,0.12);
    }

    #startScreen p {
      margin: 18px 0 28px;

      color: #aaa;
      font-size: 16px;
      letter-spacing: 1px;
    }

    #playButton {
      border: none;
      outline: none;

      padding: 18px 48px;

      border-radius: 999px;

      color: white;
      background: #ff1744;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 30px rgba(255, 23, 68, 0.45);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    #playButton:hover {
      transform: scale(1.08);

      background: #ff4565;

      box-shadow:
        0 0 45px rgba(255, 23, 68, 0.65);
    }

    #playButton:active {
      transform: scale(0.97);
    }

    #loading {
      display: none;

      margin-top: 20px;

      color: #999;
      font-size: 14px;
    }

    /* =========================
       SLIDESHOW
    ========================= */

    #slideshow {
      position: fixed;
      inset: 0;

      display: none;

      overflow: hidden;

      background: #000;
    }

    /*
      Each slide fills the screen.
      The image itself is NEVER cropped.
    */

    .slide {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;

      opacity: 0;

      transition:
        opacity 1.2s ease,
        transform 1.2s ease;

      transform: scale(0.96);

      pointer-events: none;
    }

    .slide.active {
      opacity: 1;

      transform: scale(1);

      z-index: 2;
    }

    .slide img {
      display: block;

      /*
        IMPORTANT:
        The image can NEVER become larger
        than the screen.

        contain = no cropping.
      */

      width: 100%;
      height: 100%;

      max-width: 100vw;
      max-height: 100vh;

      object-fit: contain;

      background: #000;

      user-select: none;
      -webkit-user-drag: none;

      /*
        Prevent weird image interpolation
        from making small pictures look blurry.
      */

      image-rendering: auto;
    }

    /* =========================
       COUNTER
    ========================= */

    #counter {
      position: fixed;

      right: 20px;
      bottom: 20px;

      z-index: 100;

      padding: 8px 13px;

      border-radius: 20px;

      color: white;

      background: rgba(0, 0, 0, 0.55);

      font-size: 13px;

      opacity: 0.7;

      backdrop-filter: blur(5px);
    }

    /* =========================
       LOADING STATUS
    ========================= */

    #loadStatus {
      position: fixed;

      left: 20px;
      bottom: 20px;

      z-index: 100;

      padding: 8px 13px;

      border-radius: 20px;

      color: #aaa;

      background: rgba(0, 0, 0, 0.55);

      font-size: 12px;

      backdrop-filter: blur(5px);
    }

    /* =========================
       ERROR SCREEN
    ========================= */

    #error {
      position: fixed;
      inset: 0;

      z-index: 2000;

      display: none;

      justify-content: center;
      align-items: center;

      padding: 30px;

      color: white;
      background: #000;

      text-align: center;
    }

    #error div {
      max-width: 600px;
    }

    #error h2 {
      margin-bottom: 10px;
    }

    #error p {
      color: #aaa;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- =========================
       START SCREEN
  ========================= -->

  <section id="startScreen">

    <h1>ANDRES PEPPA</h1>

    <p>Click play to begin.</p>

    <button id="playButton">
      ▶ PLAY
    </button>

    <div id="loading">
      Loading pictures...
    </div>

  </section>


  <!-- =========================
       SLIDESHOW
  ========================= -->

  <main id="slideshow">

    <div class="slide active">
      <img id="img1" alt="">
    </div>

    <div class="slide">
      <img id="img2" alt="">
    </div>

    <div id="counter"></div>

    <div id="loadStatus"></div>

  </main>


  <!-- =========================
       ERROR
  ========================= -->

  <div id="error">

    <div>

      <h2>Couldn't load the pictures.</h2>

      <p id="errorText"></p>

    </div>

  </div>


  <!-- =========================
       BACKGROUND MUSIC
  ========================= -->

  <audio
    id="bgm"
    src="bgm.mp3"
    preload="auto"
    loop>
  </audio>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const playButton =
      document.getElementById("playButton");

    const startScreen =
      document.getElementById("startScreen");

    const loading =
      document.getElementById("loading");

    const slideshow =
      document.getElementById("slideshow");

    const bgm =
      document.getElementById("bgm");

    const counter =
      document.getElementById("counter");

    const loadStatus =
      document.getElementById("loadStatus");

    const errorBox =
      document.getElementById("error");

    const errorText =
      document.getElementById("errorText");

    const slideElements =
      document.querySelectorAll(".slide");

    const slideImages = [
      document.getElementById("img1"),
      document.getElementById("img2")
    ];


    /* =========================
       SETTINGS
    ========================= */

    /*
      How long each picture stays
      on screen.

      Change this to whatever you want.

      5000 = 5 seconds
      10000 = 10 seconds
      etc.
    */

    const SLIDE_TIME = 5000;


    /*
      Fade duration.
    */

    const FADE_TIME = 1200;


    /*
      Supported image formats.
    */

    const ALLOWED_EXTENSIONS = [
      ".jpg",
      ".jpeg",
      ".png",
      ".gif",
      ".webp",
      ".bmp",
      ".avif",
      ".svg"
    ];


    /* =========================
       VARIABLES
    ========================= */

    let pictures = [];

    let current = 0;

    let activeSlide = 0;

    let slideshowTimer = null;

    let loadedCount = 0;


    /* =========================
       FIND GITHUB REPOSITORY
    ========================= */

    function getRepositoryInfo() {

      const hostname =
        window.location.hostname;

      const path =
        window.location.pathname
          .split("/")
          .filter(Boolean);


      if (!hostname.endsWith(".github.io")) {

        throw new Error(
          "This slideshow needs to be opened through GitHub Pages."
        );

      }


      const owner =
        hostname.split(".")[0];


      /*
        username.github.io
        OR
        username.github.io/repository
      */

      let repo;

      if (path.length > 0) {

        repo = path[0];

      } else {

        repo = `${owner}.github.io`;

      }


      return {
        owner,
        repo
      };

    }


    /* =========================
       CHECK IMAGE
    ========================= */

    function isImageFile(name) {

      const lower =
        name.toLowerCase();


      return ALLOWED_EXTENSIONS.some(
        extension =>
          lower.endsWith(extension)
      );

    }


    /* =========================
       LOAD EVERYTHING FROM PICS
    ========================= */

    async function getPictures() {

      const {
        owner,
        repo
      } = getRepositoryInfo();


      /*
        IMPORTANT:

        We use GitHub's Git Trees API
        instead of /contents/pics.

        This lets us find files inside:

        pics/
        pics/folder/
        pics/folder/subfolder/
        etc.

        So you can have as many folders
        and images as you want.
      */

      const apiURL =
        `https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`;


      const response =
        await fetch(apiURL);


      if (!response.ok) {

        throw new Error(
          `GitHub couldn't access the repository. Error ${response.status}.`
        );

      }


      const data =
        await response.json();


      if (!data.tree) {

        throw new Error(
          "GitHub returned an invalid repository tree."
        );

      }


      /*
        Find EVERY file underneath
        the pics folder.

        This includes subfolders.
      */

      pictures =
        data.tree

          .filter(file => {

            /*
              Only actual files.
            */

            if (file.type !== "blob") {
              return false;
            }


            /*
              Must be inside pics/.
            */

            if (
              !file.path.startsWith("pics/")
            ) {
              return false;
            }


            /*
              Only supported images.
            */

            return isImageFile(file.path);

          })

          /*
            Convert repository paths
            into GitHub Pages URLs.
          */

          .map(file => {

            return new URL(
              encodeURI(
                file.path
                  .split("/")
                  .map(part =>
                    encodeURIComponent(part)
                  )
                  .join("/")
              ),
              window.location.origin +
              window.location.pathname
                .replace(/\/[^/]*$/, "/")
            ).href;

          });


      /*
        Sort the images so they
        appear in a predictable order.
      */

      pictures.sort(
        (a, b) =>
          a.localeCompare(
            b,
            undefined,
            {
              numeric: true,
              sensitivity: "base"
            }
          )
      );


      if (pictures.length === 0) {

        throw new Error(
          "No supported images were found inside the pics folder."
        );

      }


      /*
        Show how many images were found.
      */

      loadStatus.textContent =
        `${pictures.length} pictures found`;

    }


    /* =========================
       PRELOAD ALL IMAGES
    ========================= */

    async function preloadImages() {

      loadedCount = 0;


      const promises =
        pictures.map(url => {

          return new Promise(resolve => {

            const image =
              new Image();


            image.onload = () => {

              loadedCount++;

              loading.textContent =
                `Loading pictures... ${loadedCount} / ${pictures.length}`;

              resolve();

            };


            image.onerror = () => {

              /*
                Don't let one broken image
                stop the entire slideshow.
              */

              console.warn(
                "Couldn't load:",
                url
              );

              loadedCount++;

              loading.textContent =
                `Loading pictures... ${loadedCount} / ${pictures.length}`;

              resolve();

            };


            image.src = url;

          });

        });


      await Promise.all(promises);

    }


    /* =========================
       SHOW IMAGE
    ========================= */

    function showImage(index) {

      const nextSlide =
        activeSlide === 0
          ? 1
          : 0;


      /*
        Put the next picture
        into the hidden slide.
      */

      slideImages[nextSlide].src =
        pictures[index];


      /*
        Update counter.
      */

      counter.textContent =
        `${index + 1} / ${pictures.length}`;


      /*
        Activate the new slide.
      */

      slideElements[activeSlide]
        .classList
        .remove("active");


      slideElements[nextSlide]
        .classList
        .add("active");


      activeSlide =
        nextSlide;

    }


    /* =========================
       NEXT IMAGE
    ========================= */

    function nextSlide() {

      /*
        Move forward exactly one image.

        When we reach the end,
        go back to image #1.
      */

      current++;

      if (current >= pictures.length) {

        current = 0;

      }


      showImage(current);

    }


    /* =========================
       START SLIDESHOW TIMER
    ========================= */

    function startSlideshow() {

      /*
        Clear an old timer if one exists.
      */

      if (slideshowTimer) {

        clearInterval(
          slideshowTimer
        );

      }


      slideshowTimer =
        setInterval(
          nextSlide,
          SLIDE_TIME
        );

    }


    /* =========================
       START
    ========================= */

    async function start() {

      try {

        playButton.style.display =
          "none";

        loading.style.display =
          "block";


        /*
          Find every picture
          recursively.
        */

        await getPictures();


        /*
          Preload every picture
          before starting.

          This prevents blank frames
          while the slideshow is running.
        */

        await preloadImages();


        /*
          Show the first image.
        */

        current = 0;

        activeSlide = 0;


        slideImages[0].src =
          pictures[0];


        slideImages[1].src =
          pictures[
            pictures.length > 1
              ? 1
              : 0
          ];


        slideElements[0]
          .classList
          .add("active");


        slideElements[1]
          .classList
          .remove("active");


        counter.textContent =
          `1 / ${pictures.length}`;


        /*
          Start music.

          Because this function was triggered
          by the user's click, browsers should
          allow the audio to play.
        */

        bgm.currentTime = 0;

        try {

          await bgm.play();

        } catch (audioError) {

          console.warn(
            "Music couldn't autoplay:",
            audioError
          );

        }


        /*
          Hide start screen.
        */

        startScreen.style.display =
          "none";


        /*
          Show slideshow.
        */

        slideshow.style.display =
          "block";


        /*
          Start cycling through
          EVERY image.
        */

        startSlideshow();


      } catch (error) {

        console.error(error);


        loading.style.display =
          "none";


        playButton.style.display =
          "block";


        errorBox.style.display =
          "flex";


        errorText.textContent =
          error.message;

      }

    }


    /* =========================
       PLAY BUTTON
    ========================= */

    playButton.addEventListener(
      "click",
      start
    );


    /* =========================
       PREVENT IMAGE DRAGGING
    ========================= */

    slideImages.forEach(image => {

      image.addEventListener(
        "dragstart",
        event => {

          event.preventDefault();

        }
      );

    });


    /* =========================
       KEYBOARD CONTROLS
    ========================= */

    document.addEventListener(
      "keydown",
      event => {

        /*
          Left arrow = previous.
        */

        if (
          event.key === "ArrowLeft" &&
          pictures.length > 0
        ) {

          current--;

          if (current < 0) {

            current =
              pictures.length - 1;

          }

          showImage(current);

        }


        /*
          Right arrow = next.
        */

        if (
          event.key === "ArrowRight" &&
          pictures.length > 0
        ) {

          nextSlide();

        }

      }
    );

  </script>

</body>
</html>
