<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Andres Peppa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       START SCREEN
    ========================= */

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      color: white;

      background:
        radial-gradient(
          circle at center,
          #292929 0%,
          #0a0a0a 55%,
          #000 100%
        );
    }

    #startScreen h1 {
      margin: 0;

      font-size: clamp(48px, 10vw, 120px);
      font-weight: 900;
      letter-spacing: -6px;
      text-align: center;

      text-shadow:
        0 0 20px rgba(255,255,255,0.12);
    }

    #startScreen p {
      margin: 18px 0 28px;

      color: #aaa;
      font-size: 16px;
      letter-spacing: 1px;
    }

    #playButton {
      border: none;
      outline: none;

      padding: 18px 48px;

      border-radius: 999px;

      color: white;
      background: #ff1744;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 30px rgba(255, 23, 68, 0.45);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    #playButton:hover {
      transform: scale(1.08);

      background: #ff4565;

      box-shadow:
        0 0 45px rgba(255, 23, 68, 0.65);
    }

    #playButton:active {
      transform: scale(0.97);
    }

    #loading {
      display: none;

      margin-top: 20px;

      color: #999;
      font-size: 14px;
    }

    /* =========================
       SLIDESHOW
    ========================= */

    #slideshow {
      position: fixed;
      inset: 0;

      display: none;

      overflow: hidden;

      background: #000;

      /*
        This is the perspective
        that makes the cube effect
        look three-dimensional.
      */
      perspective: 1800px;
      perspective-origin: center center;
    }

    /*
      This container is responsible
      for the actual 3D cube rotation.
    */

    #cube {
      position: absolute;
      inset: 0;

      transform-style: preserve-3d;

      /*
        Start with no rotation.
      */

      transform:
        translateZ(0)
        rotateY(0deg);

      will-change: transform;
    }

    /*
      Every slide is positioned on
      top of the other.

      During a transition, one rotates
      away while the other rotates in.
    */

    .slide {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;

      opacity: 0;

      pointer-events: none;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      transform-style: preserve-3d;

      overflow: hidden;
    }

    .slide.active {
      opacity: 1;
      z-index: 2;
    }

    .slide img {
      display: block;

      width: 100%;
      height: 100%;

      max-width: 100vw;
      max-height: 100vh;

      object-fit: contain;

      background: #000;

      user-select: none;
      -webkit-user-drag: none;

      image-rendering: auto;
    }

    /*
      The dark edge/shadow makes the
      rotation feel more like a real
      3D cube rather than a flat spin.
    */

    .slide::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          90deg,
          rgba(0,0,0,0.30),
          transparent 20%,
          transparent 80%,
          rgba(0,0,0,0.30)
        );

      opacity: 0;

      transition: opacity 0.2s linear;
    }

    /* =========================
       CUBE TRANSITION
    ========================= */

    /*
      Google-Slides-style cube duration.

      3.6 seconds = 3600ms.
    */

    .cube-transition {
      animation:
        cubeRotate
        3.6s
        cubic-bezier(0.45, 0, 0.25, 1)
        forwards;
    }

    /*
      The outgoing image rotates
      90 degrees away.

      The incoming image rotates
      90 degrees into position.
    */

    .slide.cube-out-right {
      animation:
        cubeOutRight
        3.6s
        cubic-bezier(0.45, 0, 0.25, 1)
        forwards;
    }

    .slide.cube-in-right {
      animation:
        cubeInRight
        3.6s
        cubic-bezier(0.45, 0, 0.25, 1)
        forwards;
    }

    .slide.cube-out-left {
      animation:
        cubeOutLeft
        3.6s
        cubic-bezier(0.45, 0, 0.25, 1)
        forwards;
    }

    .slide.cube-in-left {
      animation:
        cubeInLeft
        3.6s
        cubic-bezier(0.45, 0, 0.25, 1)
        forwards;
    }

    /*
      Rotate clockwise.
    */

    @keyframes cubeOutRight {

      0% {
        transform:
          translateX(0)
          rotateY(0deg);

        opacity: 1;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform:
          translateX(-50%)
          rotateY(-90deg);

        opacity: 0;
      }

    }

    @keyframes cubeInRight {

      0% {
        transform:
          translateX(50%)
          rotateY(90deg);

        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform:
          translateX(0)
          rotateY(0deg);

        opacity: 1;
      }

    }

    /*
      Rotate counter-clockwise.
    */

    @keyframes cubeOutLeft {

      0% {
        transform:
          translateX(0)
          rotateY(0deg);

        opacity: 1;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform:
          translateX(50%)
          rotateY(90deg);

        opacity: 0;
      }

    }

    @keyframes cubeInLeft {

      0% {
        transform:
          translateX(-50%)
          rotateY(-90deg);

        opacity: 0;
      }

      50% {
        opacity: 1;
      }

      100% {
        transform:
          translateX(0)
          rotateY(0deg);

        opacity: 1;
      }

    }

    /*
      Add shadows while the cube is rotating.
    */

    .cube-shadow-out::after {
      opacity: 0.75;
    }

    .cube-shadow-in::after {
      opacity: 0.45;
    }

    /* =========================
       COUNTER
    ========================= */

    #counter {
      position: fixed;

      right: 20px;
      bottom: 20px;

      z-index: 100;

      padding: 8px 13px;

      border-radius: 20px;

      color: white;

      background: rgba(0, 0, 0, 0.55);

      font-size: 13px;

      opacity: 0.7;

      backdrop-filter: blur(5px);
    }

    /* =========================
       LOADING STATUS
    ========================= */

    #loadStatus {
      position: fixed;

      left: 20px;
      bottom: 20px;

      z-index: 100;

      padding: 8px 13px;

      border-radius: 20px;

      color: #aaa;

      background: rgba(0, 0, 0, 0.55);

      font-size: 12px;

      backdrop-filter: blur(5px);
    }

    /* =========================
       ERROR SCREEN
    ========================= */

    #error {
      position: fixed;
      inset: 0;

      z-index: 2000;

      display: none;

      justify-content: center;
      align-items: center;

      padding: 30px;

      color: white;
      background: #000;

      text-align: center;
    }

    #error div {
      max-width: 650px;
    }

    #error h2 {
      margin-bottom: 10px;
      font-size: 30px;
    }

    #error p {
      color: #aaa;
      line-height: 1.6;
    }

    #error code {
      display: block;

      margin-top: 20px;
      padding: 15px;

      border-radius: 10px;

      color: #ff6b81;
      background: #151515;

      font-family: monospace;
      font-size: 13px;

      word-break: break-all;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      #startScreen h1 {
        letter-spacing: -3px;
      }

      #playButton {
        padding: 16px 38px;
      }

      #counter {
        right: 10px;
        bottom: 10px;
      }

      #loadStatus {
        left: 10px;
        bottom: 10px;
      }

    }

    /* =========================
       REDUCE MOTION
    ========================= */

    @media (prefers-reduced-motion: reduce) {

      .cube-transition,
      .slide.cube-out-right,
      .slide.cube-in-right,
      .slide.cube-out-left,
      .slide.cube-in-left {
        animation-duration: 0.01ms !important;
      }

    }
  </style>
</head>

<body>

  <!-- =========================
       START SCREEN
  ========================= -->

  <section id="startScreen">

    <h1>ANDRES PEPPA</h1>

    <p>Click play to begin.</p>

    <button id="playButton">
      ▶ PLAY
    </button>

    <div id="loading">
      Loading pictures...
    </div>

  </section>


  <!-- =========================
       SLIDESHOW
  ========================= -->

  <main id="slideshow">

    <div id="cube">

      <div class="slide active">
        <img id="img1" alt="">
      </div>

      <div class="slide">
        <img id="img2" alt="">
      </div>

    </div>


    <div id="counter"></div>

    <div id="loadStatus"></div>

  </main>


  <!-- =========================
       ERROR
  ========================= -->

  <div id="error">

    <div>

      <h2>Couldn't load the pictures.</h2>

      <p id="errorText"></p>

      <code id="errorURL"></code>

    </div>

  </div>


  <!-- =========================
       BACKGROUND MUSIC
  ========================= -->

  <audio
    id="bgm"
    src="bgm.mp3"
    preload="auto"
    loop>
  </audio>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const playButton =
      document.getElementById("playButton");

    const startScreen =
      document.getElementById("startScreen");

    const loading =
      document.getElementById("loading");

    const slideshow =
      document.getElementById("slideshow");

    const bgm =
      document.getElementById("bgm");

    const counter =
      document.getElementById("counter");

    const loadStatus =
      document.getElementById("loadStatus");

    const errorBox =
      document.getElementById("error");

    const errorText =
      document.getElementById("errorText");

    const errorURL =
      document.getElementById("errorURL");

    const slideElements =
      document.querySelectorAll(".slide");

    const slideImages = [
      document.getElementById("img1"),
      document.getElementById("img2")
    ];


    /* =========================
       SETTINGS
    ========================= */

    /*
      How long each image remains
      completely still before the
      next cube transition begins.

      5000 = 5 seconds
      10000 = 10 seconds
      etc.
    */

    const SLIDE_TIME = 5000;


    /*
      EXACT cube transition duration.

      3.6 seconds.
    */

    const CUBE_TIME = 3600;


    /*
      Supported image formats.
    */

    const ALLOWED_EXTENSIONS = [
      ".jpg",
      ".jpeg",
      ".png",
      ".gif",
      ".webp",
      ".bmp",
      ".avif",
      ".svg"
    ];


    /* =========================
       VARIABLES
    ========================= */

    let pictures = [];

    let current = 0;

    let activeSlide = 0;

    let slideshowTimer = null;

    let loadedCount = 0;

    let isTransitioning = false;


    /* =========================
       FIND GITHUB REPOSITORY
    ========================= */

    function getRepositoryInfo() {

      const hostname =
        window.location.hostname;

      const path =
        window.location.pathname
          .split("/")
          .filter(Boolean);


      if (!hostname.endsWith(".github.io")) {

        throw new Error(
          "This slideshow needs to be opened through GitHub Pages."
        );

      }


      const owner =
        hostname.split(".")[0];


      let repo;


      if (path.length > 0) {

        repo = path[0];

      } else {

        repo = `${owner}.github.io`;

      }


      return {
        owner,
        repo
      };

    }


    /* =========================
       FIND GITHUB PAGES BASE PATH
    ========================= */

    function getBasePath() {

      let pathname =
        window.location.pathname;


      if (pathname.endsWith("/")) {

        return pathname;

      }


      const lastSlash =
        pathname.lastIndexOf("/");


      if (lastSlash === -1) {

        return "/";

      }


      return pathname.substring(
        0,
        lastSlash + 1
      );

    }


    /* =========================
       CHECK IMAGE
    ========================= */

    function isImageFile(name) {

      const lower =
        name.toLowerCase();


      return ALLOWED_EXTENSIONS.some(
        extension =>
          lower.endsWith(extension)
      );

    }


    /* =========================
       LOAD EVERYTHING FROM PICS
    ========================= */

    async function getPictures() {

      const {
        owner,
        repo
      } = getRepositoryInfo();


      const apiURL =
        `https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1`;


      loadStatus.textContent =
        "Finding pictures...";


      const response =
        await fetch(apiURL);


      if (!response.ok) {

        if (response.status === 404) {

          throw new Error(
            `GitHub could not find the repository "${owner}/${repo}".`
          );

        }


        if (response.status === 403) {

          throw new Error(
            "GitHub API rate limit reached. Please try again later."
          );

        }


        throw new Error(
          `GitHub couldn't access the repository. Error ${response.status}.`
        );

      }


      const data =
        await response.json();


      if (!data.tree) {

        throw new Error(
          "GitHub returned an invalid repository tree."
        );

      }


      /*
        Find every image underneath
        the pics folder.
      */

      const imageFiles =
        data.tree.filter(file => {

          if (file.type !== "blob") {

            return false;

          }


          if (!file.path.startsWith("pics/")) {

            return false;

          }


          return isImageFile(file.path);

        });


      /*
        Find the GitHub Pages base path.
      */

      const basePath =
        getBasePath();


      /*
        Turn repository paths into
        real browser URLs.
      */

      pictures =
        imageFiles.map(file => {

          const encodedPath =
            file.path
              .split("/")
              .map(part =>
                encodeURIComponent(part)
              )
              .join("/");


          return (
            window.location.origin +
            basePath +
            encodedPath
          );

        });


      /*
        Natural sorting.
      */

      pictures.sort(
        (a, b) =>
          a.localeCompare(
            b,
            undefined,
            {
              numeric: true,
              sensitivity: "base"
            }
          )
      );


      if (pictures.length === 0) {

        throw new Error(
          "No supported images were found inside the pics folder."
        );

      }


      loadStatus.textContent =
        `${pictures.length} pictures found`;

    }


    /* =========================
       PRELOAD ALL IMAGES
    ========================= */

    async function preloadImages() {

      loadedCount = 0;


      const validPictures = [];


      const promises =
        pictures.map(url => {

          return new Promise(resolve => {

            const image =
              new Image();


            image.onload = () => {

              loadedCount++;

              validPictures.push(url);

              loading.textContent =
                `Loading pictures... ${loadedCount} / ${pictures.length}`;

              resolve();

            };


            image.onerror = () => {

              console.warn(
                "Couldn't load image:",
                url
              );

              loadedCount++;

              loading.textContent =
                `Loading pictures... ${loadedCount} / ${pictures.length}`;

              resolve();

            };


            image.src = url;

          });

        });


      await Promise.all(promises);


      pictures =
        validPictures;


      if (pictures.length === 0) {

        throw new Error(
          "The pics folder was found, but none of the images could be loaded."
        );

      }


      loadStatus.textContent =
        `${pictures.length} pictures loaded`;

    }


    /* =========================
       RESET SLIDE CLASSES
    ========================= */

    function resetSlideAnimations() {

      slideElements.forEach(slide => {

        slide.classList.remove(
          "cube-out-right",
          "cube-in-right",
          "cube-out-left",
          "cube-in-left",
          "cube-shadow-out",
          "cube-shadow-in"
        );

      });

    }


    /* =========================
       SHOW IMAGE WITH CUBE
    ========================= */

    function showImage(
      index,
      direction = "right"
    ) {

      if (pictures.length === 0) {

        return;

      }


      if (isTransitioning) {

        return;

      }


      if (index === current && activeSlide === 0) {

        return;

      }


      isTransitioning = true;


      /*
        Which of the two physical
        slide elements will become
        the incoming image?
      */

      const outgoingSlide =
        slideElements[activeSlide];


      const incomingSlide =
        slideElements[
          activeSlide === 0
            ? 1
            : 0
        ];


      const incomingImage =
        slideImages[
          activeSlide === 0
            ? 1
            : 0
        ];


      /*
        Put the next image into the
        incoming slide before the
        animation begins.
      */

      incomingImage.src =
        pictures[index];


      /*
        Make sure the old animation
        classes are gone.
      */

      resetSlideAnimations();


      /*
        Make the incoming slide visible
        behind the outgoing one.
      */

      incomingSlide.style.opacity =
        "1";

      incomingSlide.style.zIndex =
        "3";

      outgoingSlide.style.zIndex =
        "2";


      /*
        Determine which direction
        the cube rotates.

        Right:
          old image rotates left
          new image rotates in from right.

        Left:
          old image rotates right
          new image rotates in from left.
      */

      if (direction === "right") {

        outgoingSlide.classList.add(
          "cube-out-right",
          "cube-shadow-out"
        );

        incomingSlide.classList.add(
          "cube-in-right",
          "cube-shadow-in"
        );

      } else {

        outgoingSlide.classList.add(
          "cube-out-left",
          "cube-shadow-out"
        );

        incomingSlide.classList.add(
          "cube-in-left",
          "cube-shadow-in"
        );

      }


      /*
        Update the current image.
      */

      current =
        index;


      counter.textContent =
        `${current + 1} / ${pictures.length}`;


      /*
        Wait for the complete
        3.6 second cube animation.
      */

      setTimeout(() => {

        /*
          Remove animation classes.
        */

        resetSlideAnimations();


        /*
          The incoming slide is now
          the active slide.
        */

        activeSlide =
          activeSlide === 0
            ? 1
            : 0;


        /*
          Make sure the new slide
          is fully visible.
        */

        slideElements[activeSlide]
          .style
          .opacity = "1";

        slideElements[activeSlide]
          .style
          .zIndex = "2";


        /*
          Hide the old slide.
        */

        const oldSlide =
          slideElements[
            activeSlide === 0
              ? 1
              : 0
          ];


        oldSlide.style.opacity =
          "0";

        oldSlide.style.zIndex =
          "1";


        /*
          Allow the next transition.
        */

        isTransitioning =
          false;

      }, CUBE_TIME);

    }


    /* =========================
       NEXT IMAGE
    ========================= */

    function nextSlide() {

      if (pictures.length === 0) {

        return;

      }


      if (isTransitioning) {

        return;

      }


      let next =
        current + 1;


      if (next >= pictures.length) {

        next = 0;

      }


      showImage(
        next,
        "right"
      );

    }


    /* =========================
       PREVIOUS IMAGE
    ========================= */

    function previousSlide() {

      if (pictures.length === 0) {

        return;

      }


      if (isTransitioning) {

        return;

      }


      let previous =
        current - 1;


      if (previous < 0) {

        previous =
          pictures.length - 1;

      }


      showImage(
        previous,
        "left"
      );

    }


    /* =========================
       START SLIDESHOW TIMER
    ========================= */

    function startSlideshow() {

      if (slideshowTimer) {

        clearTimeout(
          slideshowTimer
        );

      }


      /*
        Use setTimeout instead of
        setInterval.

        This prevents the timer from
        starting another transition
        while the 3.6-second cube
        animation is still running.
      */

      function scheduleNext() {

        slideshowTimer =
          setTimeout(() => {

            nextSlide();

            /*
              Wait until the cube is
              completely finished before
              scheduling the next image.
            */

            const waitForTransition =
              setInterval(() => {

                if (!isTransitioning) {

                  clearInterval(
                    waitForTransition
                  );

                  scheduleNext();

                }

              }, 50);

          }, SLIDE_TIME);

      }


      scheduleNext();

    }


    /* =========================
       START
    ========================= */

    async function start() {

      try {

        /*
          Disable button while loading.
        */

        playButton.style.display =
          "none";

        loading.style.display =
          "block";

        errorBox.style.display =
          "none";


        /*
          Find images.
        */

        await getPictures();


        /*
          Preload images.
        */

        await preloadImages();


        /*
          Start at image #1.
        */

        current = 0;

        activeSlide = 0;


        /*
          Put first image on
          first slide.
        */

        slideImages[0].src =
          pictures[0];


        /*
          Preload second image
          into second slide.
        */

        slideImages[1].src =
          pictures[
            pictures.length > 1
              ? 1
              : 0
          ];


        /*
          First slide visible.
        */

        slideElements[0]
          .classList
          .add("active");


        slideElements[0]
          .style
          .opacity = "1";


        slideElements[0]
          .style
          .zIndex = "2";


        slideElements[1]
          .classList
          .remove("active");


        slideElements[1]
          .style
          .opacity = "0";


        slideElements[1]
          .style
          .zIndex = "1";


        /*
          Counter.
        */

        counter.textContent =
          `1 / ${pictures.length}`;


        /*
          Start music.
        */

        bgm.currentTime = 0;


        try {

          await bgm.play();

        } catch (audioError) {

          console.warn(
            "Music couldn't autoplay:",
            audioError
          );

        }


        /*
          Hide start screen.
        */

        startScreen.style.display =
          "none";


        /*
          Show slideshow.
        */

        slideshow.style.display =
          "block";


        /*
          Start slideshow.
        */

        startSlideshow();

      } catch (error) {

        console.error(
          "Slideshow error:",
          error
        );


        loading.style.display =
          "none";


        playButton.style.display =
          "block";


        errorBox.style.display =
          "flex";


        errorText.textContent =
          error.message;


        if (pictures.length > 0) {

          errorURL.textContent =
            pictures[0];

        } else {

          errorURL.textContent =
            "";

        }

      }

    }


    /* =========================
       PLAY BUTTON
    ========================= */

    playButton.addEventListener(
      "click",
      start
    );


    /* =========================
       PREVENT IMAGE DRAGGING
    ========================= */

    slideImages.forEach(image => {

      image.addEventListener(
        "dragstart",
        event => {

          event.preventDefault();

        }
      );

    });


    /* =========================
       KEYBOARD CONTROLS
    ========================= */

    document.addEventListener(
      "keydown",
      event => {

        /*
          Left arrow.
        */

        if (
          event.key === "ArrowLeft" &&
          pictures.length > 0
        ) {

          if (slideshowTimer) {

            clearTimeout(
              slideshowTimer
            );

          }


          previousSlide();

        }


        /*
          Right arrow.
        */

        if (
          event.key === "ArrowRight" &&
          pictures.length > 0
        ) {

          if (slideshowTimer) {

            clearTimeout(
              slideshowTimer
            );

          }


          nextSlide();

        }

      }
    );

  </script>

</body>
</html>
